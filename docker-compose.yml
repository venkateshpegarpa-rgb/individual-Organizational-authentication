services:

  # =========================================================
  # SINGLE MYSQL DATABASE SERVER
  # =========================================================

  ecwf-db:
    image: mysql:8.0
    container_name: ecwf-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3310:3306"
    volumes:
      - ecwf_db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================
  # AUTHENTICATION SERVICE
  # =========================================================

  auth-registration-service:
    build:
      context: .
      dockerfile: auth-registration-service/Dockerfile
    container_name: auth-registration-service
    ports:
      - "8001:8001"
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app
    depends_on:
      ecwf-db:
        condition: service_healthy
      organization-tenant-service:
        condition: service_started
      notification-service:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001"

  # =========================================================
  # ORGANIZATION & TENANT SERVICE
  # =========================================================

  organization-tenant-service:
    build:
      context: .
      dockerfile: organization-tenant-service/Dockerfile
    container_name: organization-tenant-service
    ports:
      - "8002:8002"
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app
    depends_on:
      ecwf-db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8002"

  # =========================================================
  # NOTIFICATION SERVICE
  # =========================================================

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8003:8003"
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app
    depends_on:
      ecwf-db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8003"

# ===========================================================
# VOLUMES
# ===========================================================

volumes:
  ecwf_db_data: